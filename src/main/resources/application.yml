spring:
  application:
    name: SoulComfortAI
  profiles:
    active: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: ${ai.open.api-key}
      embedding-model:
        model-name: text-embedding-v4
        api-key: ${ai.open.api-key}
      streaming-chat-model:
        model-name: qwen-max
        api-key: ${ai.open.api-key}
bigmodel:
  api-key: ${bigmodel.api-key}
server:
  port: 8081
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.hxq.soulcomfortai: DEBUG
    dev.langchain4j.mcp: WARN
    dev.langchain4j.mcp.client.transport: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

soul:
  redis:
    ttl-days: ${SOUL_REDIS_TTL_DAYS:90}
    max-messages: 500

jwt:
  secret: ${JWT_SECRET:changeme-please-use-a-strong-random-secret-key-at-least-32-chars}
  expiration: 2592000000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3003}